name: create-story
description: "Create the next user story from epics+stories with enhanced context analysis and direct ready-for-dev marking"
author: "BMad (vendored and adapted by agent-workflow-kit; see vendor NOTICE.md)"

# Variable resolution (see workflow-engine.xml step 1a):
#   "config: <section>.<key>" → value from .workflow/config.toml, read with
#     uv run --no-project .workflow/scripts/wfconfig.py get <section>.<key>
#   Relative config paths resolve against the repo root (wfconfig.py root).
#   "{skill-root}" → the directory holding this file.
#   A value the caller supplies (story key, output path, mode) overrides the default here.

# Critical variables from config
user_name: "config: project.owner"
communication_language: "config: project.communication_language"            # default "English"
document_output_language: "config: project.document_output_language"        # default "English"
date: system-generated
planning_artifacts: "config: paths.planning_dir"
implementation_artifacts: "config: paths.specs_dir"
epics_dir: "config: paths.epics_dir"
output_folder: "{implementation_artifacts}"
story_dir: "{implementation_artifacts}"

# Workflow components (skill-relative)
installed_path: "{skill-root}"
engine: "{skill-root}/workflow-engine.xml"
template: "{skill-root}/template.md"
instructions: "{skill-root}/instructions.xml"
validation: "{skill-root}/checklist.md"

# Variables and inputs
variables:
  sprint_status: "config: paths.sprint_status" # Primary source for story tracking
  epics_file: "{planning_artifacts}/epics.md" # Enhanced epics+stories with BDD and source hints
  prd_file: "{planning_artifacts}/prd.md" # Fallback for requirements (if not in epics file)
  architecture_file: "{planning_artifacts}/architecture.md" # Fallback for constraints (if not in epics file)
  ux_file: "{planning_artifacts}/*ux*.md" # Fallback for UX requirements (if not in epics file)
  story_title: "" # Will be elicited if not derivable

# Project context — glob; "" in config falls back to the default below
project_context: "config: paths.project_context" # default "**/project-context.md"

# Caller override: when the caller supplies an output path (e.g. a spec target inside a
# story worktree), it replaces this default.
default_output_file: "{story_dir}/{{story_key}}.md"

# Smart input file references - Simplified for enhanced approach
# The epics+stories file should contain everything needed with source hints
input_file_patterns:
  prd:
    description: "PRD (fallback - epics file should have most content)"
    whole: "{planning_artifacts}/*prd*.md"
    sharded: "{planning_artifacts}/*prd*/*.md"
    load_strategy: "SELECTIVE_LOAD" # Only load if needed
  architecture:
    description: "Architecture (fallback - epics file should have relevant sections)"
    whole: "{planning_artifacts}/*architecture*.md"
    sharded: "{planning_artifacts}/*architecture*/*.md"
    load_strategy: "SELECTIVE_LOAD" # Only load if needed
  ux:
    description: "UX design (fallback - epics file should have relevant sections)"
    whole: "{planning_artifacts}/*ux*.md"
    sharded: "{planning_artifacts}/*ux*/*.md"
    load_strategy: "SELECTIVE_LOAD" # Only load if needed
  epics:
    description: "Enhanced epics+stories file with BDD and source hints"
    whole: "{planning_artifacts}/*epic*.md"
    sharded: "{epics_dir}/*.md"
    load_strategy: "SELECTIVE_LOAD" # Only load needed epic
