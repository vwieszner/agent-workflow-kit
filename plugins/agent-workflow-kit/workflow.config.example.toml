# agent-workflow-kit configuration — installed as .workflow/config.toml
#
# Every project-specific value used by the kit's skills, agents, hooks and scripts lives here.
# Prose refers to keys as `config: <section>.<key>`. Scripts read them via
# .workflow/scripts/wfconfig.py. Command templates accept {placeholders}:
#   {repo} {worktree} {stack} {slot} {story_id} {branch} {labels} {service} {compose} {project}
#   and every port env var name declared in [stack.ports] (e.g. {BACKEND_PORT}).
# Optional capabilities degrade explicitly: stack.runtime = "none", graph.tool = "none",
# paths.quality_bar_doc = "" each make the dependent steps print SKIPPED instead of running.

[project]
name = "myproject"
owner = "the owner"               # display name for the human who approves checkpoints
communication_language = "English"      # language skills use when talking to the owner
document_output_language = "English"    # language of documents create-story writes

[git]
base_branch = "development"       # stories branch from and merge back into this
main_branch = "main"
branch_prefix = "story/"          # story branch = branch_prefix + story_id
worktrees_root = "../{project}-worktrees"   # relative to repo root; {project} = project.name
merge_style = "--no-ff"
max_commits_per_story = 2         # impl commit + optional close-out commit
impl_commit_template = "<type>: [Story {story_id}] <summary>"   # <type>: feat | fix | docs | refactor | test
closeout_commit_template = "chore: [Story {story_id}] code review close-out — <summary>"
# Gitignored files story_setup.py copies from the repo root into a new worktree (never
# overwriting the worktree's own copy). Compose reads `.env` from the worktree, so without it
# every ${VAR:-default} silently takes its default in the slot stack. [] disables seeding.
worktree_seed_files = [".env"]
train_prefix = "train/"            # merge-train branch = train_prefix + branch suffix (merge_train.py, land guard)

[paths]
specs_dir = "docs/implementation-artifacts"               # story specs: <specs_dir>/<story-key>.md
sprint_status = "docs/implementation-artifacts/sprint-status.yaml"
story_history_dir = "docs/implementation-artifacts/story-history"
slot_registry = "docs/implementation-artifacts/slot-registry.md"
deferred_work_dir = "docs/implementation-artifacts/deferred-work"
epics_dir = "docs/planning-artifacts/epics"
planning_dir = "docs/planning-artifacts"
active_plan = ""                  # optional path to the active implementation plan
quality_bar_doc = ""              # optional release/quality bar doc; "" disables the triage bar gate
lessons = "LESSONS.md"
scripts_index = "scripts/INDEX.md"   # the PROJECT's script registry (curation loop)
artifact_catalog = ".workflow/state/artifact-catalog.md"
# Permanent-failure log the autonomous loop appends to (log_failure.py). Markdown,
# committed, human-inspected before a failed story is resumed.
auto_dev_failure_log = "docs/implementation-artifacts/auto-dev-failures.md"
# Glob for a project-context doc create-story loads as extra implementation rules.
# "" → create-story uses "**/project-context.md"; no match is reported, not an error.
project_context = ""
# Optional external-owner (e.g. designer) question tracker: story_research_pack / story-spec /
# parallel-dev-wave. "" → that section SKIPPED.
design_questions = ""             # e.g. "docs/planning-artifacts/design-questions.md"
design_ticket_regex = "\\b[A-Z][A-Z0-9]+-\\d+\\b"   # ticket keys in that tracker (should match config: tracker.project_key keys)
# rules-defer: open rows for deferred product scope no not-done story covers ("" → a defer goes to the owner).
product_backlog = ""
# harness-review: the ranked harness backlog and the frozen baseline it is measured against.
harness_backlog = "docs/planning-artifacts/harness-backlog.md"
harness_baseline = "docs/planning-artifacts/harness-baseline.md"

[sprint_status]
note_max_chars = 240
statuses = ["backlog", "ready-for-dev", "in-progress", "review", "done", "blocked", "deferred", "optional"]

[story_ledger]
# Review-layer dispatches closer together than this (minutes) form one review round.
round_gap_min = 45
# Worktree-relative path prefixes whose uncommitted changes do NOT count as a
# half-applied patch. paths.specs_dir is always added.
non_source_prefixes = ["docs/"]

[slots]
count = 6                         # isolated slots 1..count
shared_slot = 0                   # the shared dev stack; never assigned to a story
stack_prefix = "story-"           # isolated stack/project name = stack_prefix + story_id
shared_stack_name = "myproject"   # compose project name of the shared dev stack

[stack]
# "docker-compose" → each slot gets an isolated compose project with offset ports.
# "none"           → slots are git worktrees only; every stack step is skipped (and says so).
runtime = "docker-compose"
compose_cmd = "docker compose"
engine_cmd = "docker"             # container-engine CLI for non-compose calls (volume/network listing)
compose_file = "docker-compose.yml"
compose_dir = "."                 # dir (relative to the worktree) holding the compose file
services = []                     # services that must be running, e.g. ["backend", "worker", "db"]
# Services that must report health "healthy" (not just "running") before the slot counts as ready.
require_healthy = []
app_service = "backend"           # service that runs the app/test commands
watch = true                      # run `compose watch` for live sync in each slot
port_stride = 100                 # slot N port = base + N * port_stride
bring_up_timeout_s = 300          # bounds the background bring-up
ready_wait_timeout_s = 300        # wait_for_stack_ready.py default --timeout-sec
ready_poll_s = 5
seed_cmd = ""                      # run after a story stack's ready poll (and `bring_up_story_stack.py --mode up|seed`); "" → none
seed_absent_regex = ""             # output regex meaning "the tree predates the seed" → outcome `absent`, not a failure
story_env = {}                     # { VAR = "value" } every story-stack compose child gets; up/watch append missing keys to the worktree .env
watch_ready_text = ""              # wait_for_watch_ready.py ready marker; "" → "Watch enabled"
watch_failure_texts = []           # extra failure markers for wait_for_watch_ready.py

[stack.ports]
# Every host port mapping in the compose file MUST read one of these env vars
# (${VAR:-default}); the kit passes ALL of them to every compose invocation.
# BACKEND_PORT = 8001
# PROXY_PORT = 8080
# POSTGRES_PORT = 5432

[stack.health]
# Commands run by stack_preflight.py; exit 0 = healthy. Templates; optional timeout_s (default 90).
# Placeholders: {compose} {stack} {worktree} {slot} {service} {repo} + port vars.
checks = [
  # { name = "app-health", cmd = "{compose} -p {stack} exec -T backend curl -fsS http://localhost:8000/health", timeout_s = 45 },
  # { name = "migrations", cmd = "{compose} -p {stack} exec -T backend <migration check command>" },
]
# Source dir inside the app container that mirrors the worktree (sync check); "" disables.
container_src = ""
worktree_src = "."                # worktree-relative dir synced into container_src
# Code-sync check: substrings of worktree-relative paths to skip (mirror the compose
# `develop.watch` ignore list); directory names listed here are also pruned from the walk.
sync_ignores = [".git", "__pycache__", ".pytest_cache", ".pyc", "node_modules"]
sync_sample_count = 3             # most-recently-modified files compared per preflight run
sync_grace_s = 30                 # a mismatch on a file younger than this is WARN, not FAIL
# Watch mounts, most-specific prefix wins. Empty → one mount worktree_src → container_src
# in stack.app_service. List every `develop.watch` sync target:
# sync_mounts = [
#   { host_prefix = "src/frontend/", services = ["frontend"], container_root = "/app" },
#   { host_prefix = "src/",          services = ["backend", "worker"], container_root = "/app" },
# ]
sync_mounts = []

[env]
# Host-passive mode: app-side commands (the app's runtime, package managers, test runners)
# run only inside the app container via `{compose} -p {stack} exec -T <service> ...`.
# false → the host-passive rule is off (app runs on the host).
# true also makes the shell guards deny bare host `python`/`python3` (allowed: `uv run ...`,
# env.project_python, `.workflow/` kit scripts, container exec segments).
app_runs_in_container = true
# Sanctioned runner for standalone tooling scripts and hooks on the host (stdlib / PEP 723 only).
host_tooling_runner = "uv run --no-project"
# Interpreter for host scripts that import project code (e.g. ".venv/bin/python"). "" → none sanctioned.
project_python = ""
# Dependency manifests/lockfiles that must be committed together after any dependency change.
dependency_files = []             # e.g. ["pyproject.toml", "uv.lock", "package.json", "package-lock.json"]
# Host commands allowed to EDIT dependency manifests without installing anything.
dependency_edit_cmds = []         # e.g. ["uv add --no-sync {pkg}", "uv lock"]
dependency_rebuild_cmd = ""       # e.g. "{compose} build backend worker && {compose} up -d"
container_install_cmd = ""        # e.g. "{compose} exec -T frontend npm install {pkg}"
# dependency-sync rule: command that rebuilds/publishes the base image's builder stage ("" = no builder stage).
base_image_build_cmd = ""

[tests]
# {labels} = space-separated test labels chosen by the agent.
scoped_cmd = ""                   # e.g. "{compose} -p {stack} exec -T backend pytest {labels}"
full_cmd = ""                     # the full gate's main leg; run by run_full_suite.py
unit_frontend_cmd = ""            # optional concurrent leg
e2e_cmd = ""                      # optional concurrent leg
lint_cmd = ""
# Optional sequential phases around the concurrent legs: { name = "<label>", cmd = "<template>" }.
# A failing pre-phase aborts the gate with its own exit code; a failing post-phase fails it (exit 1).
full_pre_phases = []    # e.g. [{ name = "lint", cmd = "{compose} -p {stack} exec -T app make lint" }]
full_post_phases = []   # e.g. [{ name = "coverage-check", cmd = "python3 tools/check_coverage.py" }]
# Schema-vs-migration drift check, run by run_full_suite.py as the first pre-phase ONLY when a
# file matching pipeline.schema_globs changed against git.base_branch; "" → SKIPPED (announced).
schema_drift_cmd = ""   # e.g. "{compose} -p {stack} exec -T backend python manage.py makemigrations --check --dry-run"
# Regexes run_full_suite.py / run_scoped_tests.py use to parse results.
fail_id_regex = "^(?:FAIL|ERROR): (\\S+)"
summary_regex = "^(?:Ran \\d+ tests?|=+ .* in [\\d.]+s)"
full_lock_timeout_min = 60        # a gate queued behind its lock (see gate_lock_scope) fails after this
# Parser of the default scoped leg (positional labels → scoped_cmd): "regex" (fail_id_regex /
# summary_regex) | "unittest" | "vitest" | "playwright".
scoped_parser = "regex"
# Extra scoped legs, selected with `run_scoped_tests.py --leg NAME=VALUE` (repeatable; {labels} = the
# values). parser as above; strip_prefix is removed from each value; optional per-leg
# fail_id_regex / summary_regex.
scoped_legs = []   # e.g. [{ name = "unit", cmd = "{compose} -p {stack} exec -T frontend npx vitest --run {labels}", parser = "vitest", strip_prefix = "frontend/" }]
# Host script-tests leg (`--scripts` / `--scripts-test`): runs on the HOST in the worktree.
scripts_tests_dir = "scripts/tests"
scripts_cmd = ""        # "" → "<python> -m unittest discover -s <scripts_tests_dir> -p 'test_*.py' -t ."; may use {python} {scripts_tests_dir}
scripts_python = ""     # interpreter for that leg; "" → the interpreter running the wrapper
scripts_env = {}        # extra env for that leg
scripts_root = "scripts"   # subtree hashed as `scripts-tree` in a recorded --scripts run
# Subtree the stack runs, hashed as `code-tree` in GREEN record lines (scoped --record and the
# gate's --record). "." → the whole tree minus paths.specs_dir and .workflow/state.
code_root = "."
record_invariant_labels = []   # repo-invariant test labels added to the default leg of a --record run
record_checks = []             # [{ name, cmd }] run after the legs of a --record run (lint, static checks); non-zero fails it
sync_wait_attempts = 36        # --require-synced polls
sync_wait_poll_s = 5
gate_lock_scope = "stack"      # "stack" → one full gate per stack (first-come-first-served line); "host" → one per host
preflight_wait_s = 300         # a --record gate re-runs a failing preflight for up to this long, then exits 75 (not run)
artifact_dirs = []             # worktree-relative test-output dirs gate_campaign.py keeps per run, e.g. ["test-results"]

[tests_policy]
# Substrings every scoped/backend test invocation MUST carry (non-interactive flags, test profile).
# Enforced: run_scoped_tests.py (tests.scoped_cmd) and run_full_suite.py (tests.full_cmd) exit 2
# with CONFIG-ERROR when the rendered command lacks one.
required_flags = []             # e.g. ["--noinput", "--settings=myapp.settings.test"]
# E2E locator attribute — the ONLY permitted locator strategy. "" disables the locator policy.
e2e_locator_attr = "data-testid"
e2e_page_objects_dir = ""         # e.g. "frontend/tests/pages"; "" disables
e2e_worker_fixture = ""           # e.g. "frontend/tests/helpers.js::testUsers"
e2e_capacity_knobs = []           # knobs that must move together when raising E2E worker count
live_infra_test_bases = []        # helper bases giving live-infra tests their per-test isolation token
e2e_strike_limit = 3              # failed E2E fix attempts before stopping with a failure packet

[ui]
base_url = ""                     # base URL for UI-driven tasks (the proxy), e.g. "http://localhost:8080"
credentials_source = ""           # where valid test credentials are defined; never guess them
# Frontend source prefixes: story_record.py `reach` (ui-state-reach trigger). [] → reach SKIPPED.
frontend_src_prefixes = []        # e.g. ["web/src/"]
frontend_test_regex = "\\.(?:test|spec)\\.[jt]sx?$"   # files under those prefixes that are tests
seed_module = ""                  # the project's UI-state seed module (ui-seed skill); "" → MISSING states become questions
seed_tests = ""                   # its tests
seed_rules = ""                   # optional doc of project seed conventions (reserved id ranges, UI flags in story stacks)

[schema]
# Pre-production single-migration policy. true → no new migration files; edit the initial
# migration in place; no backward-compatibility tests; reset stale DBs after editing.
preprod = false
test_db_reset_cmd = ""            # lists/drops reused (--keepdb-style) test databases. "" → state it manually
stack_reset_cmd = ""              # e.g. "{compose} -p {stack} down -v && {compose} -p {stack} up -d --build"

[pipeline]
# Globs of persistent-schema definition files. A story editing a match triggers story-impl's
# schema-impact check. [] → the check is skipped and says so.
schema_globs = []                 # e.g. ["**/migrations/*.py", "db/schema.sql"]
post_reset_cmds = []              # run after a full slot reset, e.g. re-seeding test users
# Extra globs (beyond env.dependency_files, schema_globs, stack.compose_file, Dockerfile*) whose
# change under a rebase means the slot stack must be rebuilt, e.g. seeded feature-flag defaults.
stack_affecting_globs = []
# Run in the slot stack after a rebase brings in a change to env.dependency_files — refreshes
# dependency volumes a plain `up --build` leaves stale. Templates ({compose} {stack} ...).
dependency_refresh_cmds = []      # e.g. ["{compose} -p {stack} exec -T frontend npm install"]
# Run in the slot stack after a rebase brings in a stack_affecting_globs change (re-seed defaults).
reseed_cmds = []                  # e.g. ["{compose} -p {stack} exec -T backend python manage.py seed_flags"]
# Story size: at most this many behaviour ACs per story (tokens/a11y, tests, flag flips and
# ownership notes do not count). 0 = no cap.
max_behaviour_acs = 5
full_suite_hang_cap_min = 15      # test-bat-runner: RUNNING wall-time cap before declaring a hang
# Land guard (story_ledger / merge_train): paths the full gate never reads. A base-branch move
# touching only these keeps a GREEN valid; top-level *.md always counts as inert.
gate_inert_prefixes = ["docs/", ".workflow/", ".claude/", ".opencode/"]
gate_input_exceptions = []        # inert-by-prefix paths a build still reads (always gate inputs)
# Generated files story-rebase regenerates instead of hand-merging when a path under trigger_prefix
# is in the rebase's OVERLAP list: { path = "<file>", trigger_prefix = "<dir>/", cmd = "<template>" }
generated_files = []
comment_rule_suffixes = []        # rules-comment-discipline scope; [] = every source file

[smoke]
# Post-merge smoke on the shared stack. Services must be running; logs checked for these.
services = []
log_error_patterns = ["Traceback \\(most recent call last\\)", "\\bERROR\\b", "Exception"]
log_since = ""                    # e.g. "5m" narrows the scan; "" → last log_tail lines only
log_tail = 20                     # log lines per service scanned
# Source-sync gate: git pathspecs of the merge diff to verify; empty → the sync-mount host prefixes.
sync_paths = []
sync_exts = [".py", ".js", ".jsx", ".ts", ".tsx", ".json"]   # empty → every file in sync_paths
max_sync_files = 40
# Failure diagnoses: first matching pattern(s) against the log tails are printed with cause + fix.
# `fix` is a template: {compose} {stack} {services} {service} {ports_env} {repo}.
# Omit `fix` to print "surface the log lines; do NOT auto-fix".
diagnoses = [
  { id = "B", title = "Package restructure / file deletion", pattern = "ModuleNotFoundError|ImportError|cannot import name|Cannot find module", cause = "compose watch syncs new/modified files but does NOT delete removed files; a deleted module still exists in the container, shadowing the new layout.", fix = "{ports_env} {compose} -p {stack} up -d --build {services}" },
  { id = "C", title = "Possible env-var change", pattern = "KeyError|environment variable|env var", cause = "env vars are baked at container creation; neither compose watch nor a code sync picks up env-file changes.", fix = "{ports_env} {compose} -p {stack} up -d --force-recreate {services}" },
]
# Merge touched migrations → live-DB drift diagnosis. Empty regex disables it.
migration_paths_regex = ""        # e.g. "migrations/"
migration_plan_cmd = ""           # the migration tool's dry-run/plan command
migration_plan_clean_regex = ""   # regex matching the plan output when nothing is pending
# Diagnosis A — a startup migration / entrypoint failure in the log tails (no auto-fix; the
# reset path is the owner's call). "" disables it.
migration_failure_regex = ""      # e.g. "manage\\.py migrate|OperationalError|ProgrammingError"

[integrity]
# check_settings_and_docs_integrity.py (dev-preflight Step 0): passages a hook or script quotes
# that must still exist verbatim in `file`. `quoted_by` (optional) must still exist too.
# [] → the passage check is SKIPPED (announced); the hook-wiring check always runs.
quoted_passages = []              # e.g. [{ file = ".workflow/AGENTS.local.md", text = "Test-fix iteration", quoted_by = ".workflow/hooks/guards/dispatch_prompt.py" }]

[review]
round2_min_patches = 5            # round-2 review fires at >= this many approved patches
round2_min_files = 4              # ... or patches touching >= this many unique files
required_preamble = "Report findings only — do NOT auto-apply patches — do NOT edit any files — recommend a classification per finding (patch / defer / dismiss) but the owner triages each one."
workflow_name = "review"          # the review Workflow's name (journal facts; story_ledger rounds)
close_out_cap = 2                 # close-out rounds after the latest branch round before the loop ends
chunk_max_lines = 3000            # max lines per diff chunk a review layer reads
path_rewrites = []                # [[regex, replacement]] mapping cited container paths onto repo paths, e.g. [["^/app/", "src/"]]
ui_paths = []                     # worktree-relative UI dirs (source + UI tests) the ui-verifier's diff covers; [] → ui-verifier skipped
ui_test_regex = "\\.(?:test|spec)\\.[cm]?[jt]sx?$"   # files under ui_paths that are tests, not UI source
ui_profile = ""                   # repo-relative UI profile doc (see the ui-verifier agent); "" → ui-verifier skipped
ui_base_url = ""                  # template for the story stack's UI, e.g. "http://localhost:{PROXY_PORT}"; "" → ui-verifier skipped
ui_seed_cmd = ""                  # template run before the ui-verifier (exit 0 = seeded); "" → no seed step
backend_source_regex = ""         # changed files test-adequacy mutates (with mutation.enabled), e.g. "^src/.+\\.py$"; "" → stage skipped
backend_test_regex = "(^|/)tests?/|(^|/)test_[^/]*\\.py$|_test\\.py$"   # which of those are tests
source_exclude_regex = "/(migrations|settings)/"   # never mutated
pbt_source_regex = ""             # changed modules whose pure functions pbt-writer property-tests (Hypothesis); "" → stage skipped
library_segments = ["node_modules", "site-packages"]   # path segments review agents may not read (third-party source)
# Basenames of the repro / property tests the review writes (repro_paths guard, finalize adoption,
# halt and ledger checks).
repro_test_name_regex = "^(test_(?:repro|pbt)_r\\d+_\\d+\\.py|repro_r\\d+_\\d+\\.test\\.[cm]?[jt]sx?|repro-r\\d+-\\d+\\.spec\\.[cm]?[jt]s)$"
repro_roots = []                  # worktree-relative dirs repro/property tests may be written in; [] → anywhere in the worktree
repro_py_parent_dirs = ["tests", "test"]   # a Python repro test sits in one of these dirs; [] → any
repro_runner_options = ["--project-name", "--story-id", "--tail", "--timeout", "--require-synced"]   # run_scoped_tests.py options repro/pbt writers may pass

[review.mutation]
enabled = false                   # test-adequacy (mutmut 3, Python) stage
service = ""                      # compose service to run in ("" → host, POSIX sh; app root = the worktree)
app_root = "/app"                 # app root inside that service
src_prefix = ""                   # repo-relative prefix stripped to get the path under the app root, e.g. "src"
mutmut = "mutmut"                 # mutmut executable
pytest_args = []                  # extra pytest args
skip_dirs = [".venv", "mutants", "node_modules", "logs", ".git"]
timeout_s = 420

[spec]
# Tags of external owners whose questions the owner does not rule: `[OPEN-Q n] (<tag>)` markers.
# story_record.py `rule` refuses them; story-spec drafts an interim beside them. [] → none.
external_question_tags = []       # e.g. ["Designer"]

[story_record]
# Repo-relative dirs whose tree hash a phase-2/3 GREEN record line must carry as `<label>-tree <hash>`
# (label: path with "/" as "-", "." as "repo"); agent_outcome blocks a completion claim whose HEAD
# tree differs. [] disables the check.
tested_trees = []

[land]
holder_stall_min = 180            # merge_train.py wait --holder-stall-min default
train_gate_bound_min = 55         # wall-clock bound of one train gate child (keep below holder_stall_min)
restart_services = []             # services restarted after a killed train gate; [] → stack.services
restart_bound_s = 60
health_wait_s = 263               # compose `up --wait` bound after that restart

[browser]
mcp_server = ""                   # browser MCP the ui-verifier drives (agent capability `browser`), e.g. "playwright"; "" disables

[models]
# tier → model id, per tool. Agents declare a tier; install.py renders the concrete model.
# Claude Code permissionMode rendered into every agent ("auto" lets unattended subagents run
# tools without prompting; "" → omit, the agent prompts per the session's mode). A per-agent
# `claude: {permissionMode: ...}` override in the agent source wins. Re-render with
# `install.py install --force` after a change.
claude_permission_mode = "auto"
[models.claude]
deep = "opus"
standard = "sonnet"
fast = "haiku"
[models.opencode]
deep = "anthropic/claude-opus-5-5"
standard = "anthropic/claude-sonnet-5"
fast = "anthropic/claude-haiku-4-5-20251001"
# Fallback for a failed `deep`-tier dispatch (story-spec, review layers, findings-evaluator):
# retried once with this model as a dispatch-time override. "" → retry on the same model.
# findings-verifier never uses a fallback. OpenCode has no per-dispatch model override, so a
# non-empty opencode value only applies where the adapter supports it.
[models.fallback.claude]
deep = ""                         # e.g. "sonnet"
[models.fallback.opencode]
deep = ""

[graph]
# Optional code knowledge-graph MCP. "none" → graph steps skipped; navigation uses grep/read.
tool = "none"                     # "codebase-memory-mcp" | "none"
mcp_server = "codebase-memory-mcp"
cli = ""                          # CLI binary used to index a worktree, e.g. "~/.local/bin/codebase-memory-mcp"
main_project = ""                 # graph project name of the main checkout (slot agents must not query it)
# Per-project index files (<project>.db); graph_query denies queries against an unindexed
# project. "" or a missing dir skips that check.
cache_dir = "~/.cache/codebase-memory-mcp"

[docs]
# Optional library-docs MCP (agents with the `docs` capability). "" disables.
mcp_server = "context7"

[guards]
# Each guard can be disabled individually. Pattern lists extend the built-in defaults.
# Guards fail OPEN on an internal error and CLOSED on a matched rule.
bash_command = true
powershell_command = true
dispatch_prompt = true
phase_dispatch = true
graph_query = true
mcp_readonly = true
script_registration = true
agent_source_read = true
process_kill = true               # raw kill/taskkill/Stop-Process denied; kill_owned.py calls get --since/--worktree + a token
commit_via_bash = true            # PowerShell `git commit` denied: commit-review hooks run on Bash only
story_write_paths = true          # story subagents write only inside their own worktree
propagate_paths = true            # story-propagate writes only the files its dispatch lists
land_lease_wait = true            # no owner question / stop while holding the land lease
auto_dev_guard = true             # keep-halted guard (auto_dev_keep.py)
agent_dispatch = true             # nested-dispatch edge allowlist + story-impl escalation
clear_offer = true                # hold a phase dispatch once after a heavy checkpoint until /clear is offered
clear_offer_context_tokens = 300000
review_run_paths = true
review_code_paths = true
repro_paths = true
mutation_command = true
playwright_paths = true
review_coverage = true
# Commands that must never run on the host (they belong in a container), regex list.
# Empty → the host-passive rule is prose only, not enforced.
host_forbidden = []               # e.g. ["^npm\\b", "^node\\b"] (bare python: see env.app_runs_in_container)
host_forbidden_hint = ""          # remedy text appended to a host_forbidden denial
block_host_installs = true        # pip install / uv pip install / uv sync / uv add without --no-sync
# Branches no agent may push to. Empty → [git.main_branch, git.base_branch, "master"].
protected_branches = []
# Project command rules for Bash and PowerShell (regex, case-insensitive, whole command). Example:
# command_deny = [ { pattern = "manage\\.py\\s+makemigrations(?![^|;&\\n]*--(check|dry-run))", reason = "edit the initial migration instead" } ]
command_deny = []
# Recursive-delete allowlist for both shell guards (templates; {repo}/{project} allowed). A target
# must be STRICTLY inside a root. Empty → repo root, worktrees root, and `claude*`/`workflow*` dirs
# of the system temp dir. `/`, drive roots and `~`/$HOME are never allowed unless listed.
# Built in regardless: git reset --hard, git filter-branch, git update-ref -d, Format-Volume, Clear-Disk.
recursive_delete_allowed = []
# Subagents exempt from / subject to the "report findings only" preamble check.
# `general-purpose` is deliberately absent: a generic dispatch falls through to prose review detection.
non_review_agents = ["story-spec", "story-impl", "story-finalize", "story-rebase", "story-diagnose", "story-propagate", "test-bat-runner", "dev-preflight", "trace-port-traffic", "milestone-map-refresh", "repro-writer", "pbt-writer", "Explore", "Plan"]
review_agents = ["blind-hunter", "edge-case-hunter", "verification-gap", "acceptance-auditor", "findings-verifier", "findings-evaluator", "ui-verifier", "test-adequacy"]
# graph_query: agents that only run inside a story worktree (may not query graph.main_project).
# The check is SKIPPED (stated once per session) until graph.main_project is set to the main
# checkout's graph project name (the name list_projects / index_repository reports for the repo).
slot_only_agents = ["story-impl", "story-finalize", "story-rebase", "story-diagnose"]
graph_exempt_tools = ["index_repository", "list_projects", "delete_project", "index_status"]
# agent_source_read: agents denied shell reads of source files (skipped when graph.tool = "none").
source_read_gated_agents = ["story-impl", "story-finalize", "story-diagnose"]
source_suffixes = [".py", ".js", ".jsx", ".ts", ".tsx"]
# script_registration: dirs whose direct children must be registered in paths.scripts_index.
script_dirs = ["scripts"]
script_suffixes = [".py", ".ps1", ".sh"]
# mcp_readonly: database MCP servers kept read-only. dialect: "cypher" | "sql" | "none".
# mcp_readonly_servers = [ { server = "graphdb", dialect = "cypher" }, { server = "postgres", dialect = "sql", extra_deny = [] } ]
# Claude Code: install.py renders one hook matcher per server here and for graph.mcp_server —
# re-run `install.py install` after changing this list or graph.tool / graph.mcp_server.
mcp_readonly_servers = []
main_checkout_shared_paths = []   # repo-relative files a story subagent may still write in the main checkout
in_place_edit_agents = ["story-impl", "story-finalize"]   # agent_source_read: `sed -i` allowed (an edit, not a read)
review_run_paths_agents = ["blind-hunter"]
review_code_paths_agents = ["edge-case-hunter", "verification-gap", "acceptance-auditor", "findings-verifier"]
repro_paths_agents = ["repro-writer", "pbt-writer"]
mutation_command_agents = ["test-adequacy"]
review_coverage_agents = ["blind-hunter", "edge-case-hunter", "verification-gap", "acceptance-auditor", "ui-verifier", "pbt-writer", "test-adequacy"]
# Nested dispatch allowlist: caller agent -> callees it may spawn (run_in_background must be false).
dispatch_edges = { "story-impl" = ["story-diagnose", "dev-preflight", "Explore"], "story-finalize" = ["story-diagnose", "dev-preflight"], "story-rebase" = ["story-diagnose", "dev-preflight"], "story-diagnose" = ["dev-preflight"], "story-spec" = ["Explore"] }
dispatch_edge_models = {}         # "caller->callee" = model the dispatch must pass, e.g. { "story-spec->Explore" = "sonnet" }

[session]
# Library-docs MCP tools re-asserted after compaction/resume (fully-qualified Claude names).
docs_mcp_tools = []               # e.g. ["mcp__context7__resolve-library-id", "mcp__context7__query-docs"]

[curation]
journal_retention_days = 30
proposal_kinds = ["skill", "agent", "rule", "script", "memory"]
retro_threshold = 8               # new journal facts before the analyst launches / the nudge fires
retro_cooldown_s = 600            # min seconds between two auto-launched analysts
# Headless analyst launched before compaction: "auto" | "claude" | "opencode" | "off".
# WORKFLOW_RETRO_AUTOSPAWN=0 also disables it.
analyst = "auto"
agent_source_dir = ".workflow/agents"   # promoted agents (kit source format), committed
# Promoted memory. "" → the tool's native project memory dir when it has one (Claude Code),
# otherwise ".workflow/memory" (loaded by OpenCode through opencode.json `instructions`).
memory_dir = ""
analyst_timeout_s = 1800          # a background analyst run is killed and logged as failed after this
analyst_permission_mode = "auto"  # Claude Code permission mode of the headless analyst

[loop]
# Milestone whose milestone-blockers report feeds auto-dev-loop's story picker.
# "" → the first ready-for-dev story in sprint status (file order).
milestone = ""
max_stories = 0                   # stories per invocation; 0 = unlimited; env AUTO_DEV_LOOP_MAX_STORIES overrides
cleanup_paths = []                # extra repo-relative dirs auto-dev-loop may delete recursively
# Headless tool auto_dev_driver.py launches per phase: "claude" | "opencode".
driver_tool = "claude"
driver_permission_mode = "auto"   # Claude Code permission mode of every driver session
# OpenCode command template ({prompt} and {model} are filled, each one argument). Untested live.
opencode_cmd = "opencode run {prompt}"
orchestrator_model = "opus"       # default --orchestrator-model
orchestrator_effort = "medium"    # default --orchestrator-effort: low|medium|high|xhigh|max
session_timeout_min = 300         # default --session-timeout-min (per phase session; watchdog bound)
land_stall_min = 180              # default --land-stall-min (lease holder stall budget)
# The driver kills a session whose init event lacks any of these (claude only).
required_tools = ["Bash", "Agent", "Skill", "Workflow"]
required_agents = ["story-spec", "story-impl", "findings-evaluator", "findings-verifier", "story-finalize", "story-rebase"]
extra_harness_globs = []          # extra [dir, glob] pairs hashed into the driver's harness fingerprint

[transcripts]
claude_root = "~/.claude/projects"   # root of Claude Code's per-project transcript dirs
# Globs (under claude_root) of this project's transcript dirs. [] → "<slug of repo root>*" and
# "<slug of git.worktrees_root>*" (slug = path with every non-alphanumeric char replaced by "-").
claude_project_globs = []
replay_refused = ["phase_dispatch", "repro_paths"]   # hook modules transcript_calls.py replay refuses

[agents]
# Effort-variant agents count as their base role: <role><suffix> → <role>.
escalated_roles = ["story-impl"]
effort_variant_suffixes = ["-xhigh", "-max"]

[cost]
prices = {}                       # model id → [in, out, cache_read, cache_write_5m, cache_write_1h] $/MTok overrides
mean_output_tokens = {}           # "main:<model>" / "sub:<model>" → tokens, for requests without a final usage line

[harness_metrics]
agent_phase = {}                  # extra/override name → phase maps for per-story cost attribution
skill_phase = {}
command_phase = {}

[path_rules]
# Path-scoped rule files (Claude Code `.claude/rules/*.md` with `paths:` frontmatter) injected into
# story agents working in slot worktrees. install.py registers one SubagentStart command per name.
dir = ".claude/rules"
names = []
agents = "^story-(impl|impl-xhigh|impl-max|finalize|rebase)$"   # SubagentStart matcher

[context_cap]
tokens = 300000                   # soft context cap after which context_cap.py tells an agent to hand off

[static_checks]
# One table per tool (see .workflow/scripts/static_checks.py). [] → static checks SKIPPED.
# [[static_checks.tools]]
# name = "pyright"
# cmd = ["pyright", "--outputjson"]
# suffixes = [".py"]
# format = "pyright-json"         # pyright-json | eslint-json | exit-code
# blocking_rules = ["reportUndefinedVariable", "reportMissingImports"]
tools = []

[design]
# The external design owner (a designer, a UX lead): their questions are not the owner's to rule.
# Everything here is optional; an unset path makes its step print SKIPPED.
owner_role = ""                   # display name of the role in prose, e.g. "the designer"; "" → "the design owner"
question_tag = ""                 # their spec-marker tag `[OPEN-Q n] (<tag>)`; must also be in spec.external_question_tags; "" → first external tag, none → no design owner
done_marker = "✅"                # a design-question tracker row whose Status starts with this is answered
precedence = ""                   # precedence line in the library build's screen sheets; "" → ticket answer > master > frame > intake extract > specification page
manifest = ""                     # design manifest JSON (file keys, frames, docs-page image groups); example .workflow/scripts/design_manifest.example.json
intake_dir = ""                   # design intake root: design-context/ (design_context.py), assets/ + assets-master/ (design_assets.py)
library_dir = ""                  # design library build (design_library.py: INDEX.md, sets/, frame-map/, frames/, raw/, renders/)
token_env = "FIGMA_ACCESS_TOKEN"  # env var (or repo .env key) holding the design source REST token; never stored
render_url_regex = "^https://www\\.figma\\.com/api/mcp/asset/[0-9a-f-]+\\.png$"   # design_page_renders.py accepted asset URLs
context_note = ""                 # styling rule printed in design-context headers
tokens_export = ""                # token export JSON written by design_tokens.py export (read by token_doc_check.py)
# design_tokens.py build: { service, cmd = [argv], inputs = [[worktree path, container path]], copy_back = [[worktree dir, container dir]] }; {} → SKIPPED
tokens_build = {}
token_doc = ""                    # doc holding the token tables (default: docs_mirror.mirror)
token_doc_start = ""              # heading line that starts the token section ("" → whole doc)
token_doc_end = ""                # first heading line after it that ends the section
token_table_prefixes = [["radius/", "radius table"], ["space/", "spacing table"]]   # token prefix → table name; others → "colour table"
token_required_tables = ["colour table", "text style", "effect style"]             # tables that must match ≥1 row (else exit 2: format changed)
token_semantic_collection = "Semantic"                                             # export collection whose unnamed variables are EXPORT-ONLY
# snapshot_update.py: [{ name, service, test, update_cmd = [argv], container_path, worktree_path, summary_regex? }]; [] → SKIPPED
snapshots = []

[tracker]
# Issue tracker for the design owner's tickets (design-ticket, design-sync, tracker.py).
backend = "none"                  # "jira" (REST) | "mcp" (the tracker MCP tools below) | "none"
site = ""                         # e.g. "https://example.atlassian.net"
project_key = ""
issue_type = "Task"
priority = "Medium"
assignee = ""                     # the design owner's account id (new tickets)
labels = ["design-needed"]        # labels on every new ticket (+ the story label)
story_label_prefix = "story-"     # story label = prefix + id ("." → "-")
story_query = 'project = {project_key} AND labels = "{label}"'   # search for a story's ticket
summary_prefix = "[UX]"
done_when = ""                    # ticket "Done when" text; "" → "Each question is answered on this ticket."
browse_url = ""                   # ticket link template ({site}, {key}); "" → {site}/browse/{key}
user_env = "TRACKER_USER"         # env var: account email (REST basic auth); never stored
token_env = "TRACKER_TOKEN"       # env var: API token; never stored
mcp_tools = {}                    # backend "mcp": { search = "<tool>", create = "<tool>", comment = "<tool>", comments = "<tool>" }
mcp_search_result_glob = "mcp-*search*Issues*-*.txt"   # tracker_digest.py --session: the search tool's result files

[docs_mirror]
# Read-only repo mirror of the external specification page (docs_mirror.py, token_doc_check.py, design_assets.py).
backend = "none"                  # "confluence" | "none"
site = ""                         # "" → tracker.site
page_id = ""
space = ""
mirror = ""                       # repo path of the mirror file
body_format = "storage"           # --fetch (REST v2) body format; the MCP result carries its own (markdown)
user_env = ""                     # "" → tracker.user_env
token_env = ""                    # "" → tracker.token_env
mcp_tool = ""                     # the docs MCP page-content tool (prose only)
mcp_result_glob = "mcp-*getConfluence*-*.txt"

[profiles]
# Named serving profiles a gate stack's services can run (gate_profile.py). "" → no profile handling:
# every profile step is SKIPPED (announced) and `run_full_suite.py --profile-leg` is a config error.
gate = ""                         # profile the per-merge legs need, e.g. "deterministic"
story_resting = ""                # profile a story stack rests in ("" → gate); pair with stack.story_env so a bare `up` lands in it
shared_resting = ""               # profile the shared stack rests in ("" → gate)
gate_legs = []                    # legs that need the gate profile; [] → every configured leg
services = []                     # services recreated on a switch; [] → stack.services
env_var = ""                      # env var the switch sets to the profile's `value` (compose interpolates it)
drain_cmd = ""                    # template polled before a switch until it exits 0 (no queued/running background work); "" → no drain
drain_timeout_s = 180
ready_timeout_s = 480
switch_timeout_s = 1200
probe_timeout_s = 180
poll_s = 5
# One table per profile:
# [profiles.defs.deterministic]
# value = "myapp.settings.gate"   # what env_var is set to
# probe_cmd = "{compose} -p {stack} exec -T {service} ./print-profile"   # prints one `PROFILE {json}` line
# expect = { EMBEDDER = "fake" }  # keys that JSON must carry with these values
defs = {}

[profile_leg]
# Optional extra gate leg run alone under its own serving profile (`run_full_suite.py --profile-leg`),
# due every `every` merges to git.base_branch since the last green run (profile_leg.py due).
# profile or cmd "" → not configured: `due` exits 3 (SKIPPED), `--profile-leg` is a config error.
profile = ""                      # a profiles.defs name, e.g. "real"
label = "PROFILE-LEG"             # leg label in the gate summary
cmd = ""                          # template; {specs} = the specs below joined by spaces
specs = []                        # tests/specs the leg runs
every = 10                        # merges between green runs before it is due
state_file = "profile-leg-runs.jsonl"   # under .workflow/state/ of the main checkout

[sampler]
# gate_sampler.py: load and probe sampling during a gate run.
reference_services = []           # quiet services whose container reads the VM (/proc), in preference order; [] → any container of the stack
load_budget = 1.0                 # load1 above this x CPU count is an over-budget sample
# { name, cmd, interval_s, timeout_s, slow_s }; cmd is a template ({stack} {slot} {worktree} + port vars).
# A failure or a run slower than slow_s is over budget.
probes = []

[story_state]
# Session-listing probe (argv list or string) printing a JSON array of session objects
# (id, sessionId, name, kind, cwd, startedAt, state, status, waitingFor, pid).
# "" → by loop.driver_tool: claude → `claude agents --json --all`; other tools → "unavailable".
sessions_cmd = ""

[control_room]
port = 4747                       # control_room.py --port default (binds 127.0.0.1 only)
# Window backend: "auto" (Windows Terminal on Windows when `wt` is on PATH, else tmux when on PATH,
# else background) | "windows-terminal" | "tmux" | "background" (no terminal: attach/resume refused
# with the command to run by hand; a story start runs detached, logs under .workflow/state/control-room/).
launcher = "auto"
start_prompt = "/parallel-dev-wave {story}"   # prompt a "start story session" sends; {story} filled
opencode_start_cmd = "opencode run {prompt}"  # OpenCode story-start command ({prompt}, {story}); untested live

[milestones]
# One sub-table per milestone; the dependency-map schema is in the milestone-blockers skill.
# [milestones.release-1]
# map_file = "docs/implementation-artifacts/sprint-status.yaml"   # default: paths.sprint_status
# map_key = "release-1.dependency_map"     # default "<name>.dependency_map"
# member_marker = "\\[R1\\]"               # regex on sprint-status row notes; "" skips the coverage check
# priority_markers = ["BLOCKING-T1", "BLOCKING-T2"]   # ranks group-0 candidates; [] → map order
# non_member_marker = "NOT R1"    # regex: row explicitly outside the milestone (map refresh check)
# untriaged_marker = "UNPHASED"   # regex: row waiting for triage (map refresh check)
